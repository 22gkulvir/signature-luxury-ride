<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Signature Luxury Ride Inc.</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0c0900 0%, var(--warm-dark) 50%, #0c0900 100%);
      padding: 32px 20px;
      text-align: center;
    }
    .nf-wrap { max-width: 560px; width: 100%; }
    .nf-code {
      font-family: var(--serif);
      font-size: clamp(5rem, 14vw, 8rem);
      font-weight: 700;
      line-height: 1;
      color: rgba(201,168,76,0.18);
      margin-bottom: 8px;
    }
    .nf-title {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      margin-bottom: 14px;
    }
    .nf-title em { font-style: italic; color: var(--gold); }
    .nf-sub {
      font-size: 1rem;
      color: var(--gray-light);
      line-height: 1.75;
      margin-bottom: 40px;
    }
    .nf-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
    .nf-footer { font-size: 0.8rem; color: var(--gray); }
    .nf-footer a { color: var(--gold); }
    .nf-logo { margin-bottom: 48px; display: inline-block; }
  </style>
</head>
<body>

<!-- FIX (a11y/landmark-one-main, region): wrap page content in <main>. -->
<main class="nf-wrap">
  <a href="index.html" class="nf-logo">
    <div class="nav-logo" style="text-align:center;">
      <span class="nav-logo-top" style="display:block;text-align:center;">Signature Luxury Ride</span>
      <span class="nav-logo-sub" style="display:block;text-align:center;">Inc. &mdash; Dallas, TX</span>
    </div>
  </a>

  <div class="nf-code">404</div>
  <h1 class="nf-title">This Road Leads <em>Nowhere.</em></h1>
  <p class="nf-sub">
    The page you're looking for doesn't exist or may have moved.
    Let's get you back on the road.
  </p>

  <div class="nf-actions">
    <a href="index.html" class="btn btn-gold">← Back to Home</a>
    <a href="booking.html" class="btn btn-outline">Book a Ride</a>
  </div>

  <div class="nf-footer">
    Need help? Call us at <a id="nf-phone-link" href="#">—</a> or
    <a id="nf-email-link" href="#">email us</a> anytime.
  </div>
</main>

<script src="/js/config.js"></script>
<script>
  (function () {
    if (typeof SLR_CONFIG === 'undefined') return;
    var cfg  = SLR_CONFIG.site;
    var tel  = 'tel:+1' + cfg.phone.replace(/\D/g, '');
    var mail = 'mailto:' + cfg.email;
    var ph   = document.getElementById('nf-phone-link');
    var em   = document.getElementById('nf-email-link');
    if (ph) { ph.href = tel;  ph.textContent = cfg.phone; }
    if (em) { em.href = mail; }
  })();
</script>
</body>
</html>
